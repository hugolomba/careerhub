server:
  port: 8080

spring:
  application:
    name: careerhub-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/careerhub
    username: careerhub
    password: careerhub
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is managed by Flyway, not Hibernate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  multipart:
    max-file-size: 5MB
    max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:hdfbdfh083409384gh9)+(_&@*(*%ˆ&$#%$}
    expiration-ms: 86400000 # 24h
    cv:
      storage-dir: ${CV_STORAGE_DIR:./cv-storage}
